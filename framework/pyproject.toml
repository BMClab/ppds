[project]
name = "reader-data"
version = "0.1.1"
description = "Read named Parquet resources from a local or HTTP data release with DuckDB"
readme = "src/reader_data/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcos Duarte" },
    { name = "Reginaldo K. Fukuchi" },
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0; sys_platform != 'emscripten'",
    "duckdb>=1.5.1; sys_platform == 'emscripten'",
    "fsspec[http]>=2026.9.0; sys_platform != 'emscripten'",
    "fsspec>=2026.3.0; sys_platform == 'emscripten'",
]

[project.urls]
Repository = "https://github.com/BMClab/ppds/tree/main/framework"
Documentation = "https://bmclab.github.io/ppds/framework/src/reader_data/"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
