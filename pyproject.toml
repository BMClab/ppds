[project]
name = "ppds"
version = "0.2.0"
description = "PPDS: plantar pressure recordings, pressure-derived features and 3D foot scans (code and notebooks)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marcos Duarte" },
    { name = "Reginaldo K. Fukuchi" },
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0; sys_platform != 'emscripten'",
    "duckdb>=1.5.1; sys_platform == 'emscripten'",
    # The bundled notebooks install this wheel for their plotting and playback dependencies.
    "marimo>=0.25.2",
    "matplotlib>=3.11.2; sys_platform != 'emscripten'",
    "matplotlib>=3.10.8; sys_platform == 'emscripten'",
    "numpy>=2.5.4; sys_platform != 'emscripten'",
    "numpy>=2.4.3; sys_platform == 'emscripten'",
    "pandas>=3.1.0; sys_platform != 'emscripten'",
    "pandas>=3.0.2; sys_platform == 'emscripten'",
    "plotly>=6",
    "pyarrow>=26.0.1; sys_platform != 'emscripten'",
    "pyarrow>=22.0.0; sys_platform == 'emscripten'",
    "reader-data>=0.2.0,<0.3",
    "scipy>=1.18.1; sys_platform != 'emscripten'",
    "scipy>=1.17.1; sys_platform == 'emscripten'",
]

[project.urls]
Repository = "https://github.com/BMClab/ppds"
Documentation = "https://bmclab.github.io/ppds/"
Software = "https://doi.org/10.5281/zenodo.24490656"
Dataset = "https://doi.org/10.5281/zenodo.24544934"

[tool.uv.sources]
reader-data = { workspace = true }

[tool.uv.workspace]
members = ["framework"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "framework/tests"]

[tool.ruff.lint.per-file-ignores]
# marimo displays the final expression and generates explicit cell returns.
"examples/*.py" = ["B018", "PLR1711"]

[dependency-groups]
dev = [
    "markdown>=3.11.2",
    "packaging",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
